name: Build Windows
on:
  workflow_dispatch:
  push:
    branches:
      - NuevoMaster
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.1

      - name: Diagnostic - list repo top files
        shell: pwsh
        run: |
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Top-level files and folders:";
          Get-ChildItem -Path . -Force -Depth 1 | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Tree (depth 3):"
          Get-ChildItem -Recurse -Depth 3 | ForEach-Object { Write-Host $_.FullName }

      - name: Find solution (.sln)
        id: find_sln
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $slnPath = $null
          if ($sln) { $slnPath = $sln.FullName }
          Add-Content -Path $Env:GITHUB_OUTPUT -Value ("solution=" + $slnPath)
          Write-Host "Solution found: $slnPath"

      - name: Build solution with MSBuild (if found)
        if: steps.find_sln.outputs.solution != ''
        shell: pwsh
        run: |
          Write-Host "Building solution: ${{ steps.find_sln.outputs.solution }}"
          & msbuild "${{ steps.find_sln.outputs.solution }}" /p:Configuration=Release /m

      - name: Find vcxproj (if no .sln)
        id: find_vcx
        if: steps.find_sln.outputs.solution == ''
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Filter *.vcxproj -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $projPath = $null
          if ($proj) { $projPath = $proj.FullName }
          Add-Content -Path $Env:GITHUB_OUTPUT -Value ("proj=" + $projPath)
          Write-Host "vcxproj found: $projPath"

      - name: Build vcxproj with MSBuild (if found)
        if: steps.find_vcx.outputs.proj != ''
        shell: pwsh
        run: |
          Write-Host "Building project: ${{ steps.find_vcx.outputs.proj }}"
          & msbuild "${{ steps.find_vcx.outputs.proj }}" /p:Configuration=Release /m

      - name: Collect built .exe and package
        shell: pwsh
        run: |
          $art = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $art -Force | Out-Null
          $exes = Get-ChildItem -Path . -Filter *.exe -Recurse -File -ErrorAction SilentlyContinue
          if ($exes) {
            foreach ($e in $exes) { Copy-Item -Path $e.FullName -Destination $art -Force }
            Compress-Archive -Path (Join-Path $art '*') -DestinationPath windows-build.zip -Force
            Write-Host "Packaged executables into windows-build.zip"
          } else {
            Write-Host "No .exe found after build"
            New-Item -Path (Join-Path $art "README.txt") -ItemType File -Force -Value "No executables found" | Out-Null
            Compress-Archive -Path (Join-Path $art '*') -DestinationPath windows-build.zip -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build
          path: windows-build.zip
